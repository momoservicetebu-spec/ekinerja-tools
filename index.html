<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input eKinerja Harian</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="date"], input[type="time"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { width: 100%; background-color: #3498db; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #result-box { display: none; margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 4px; }
        #result-box a { color: #16a085; font-weight: bold; word-break: break-all; }
        .loader { display: none; text-align: center; margin-top: 10px; font-style: italic; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h2>Catat Kinerja Harian</h2>
    <form id="kinerjaForm">
        
        <div class="form-group row">
            <div class="col">
                <label for="tanggal">Tanggal Kegiatan</label>
                <input type="date" id="tanggal" required>
            </div>
        </div>

        <div class="form-group row">
            <div class="col">
                <label for="jamMulai">Jam Mulai</label>
                <input type="time" id="jamMulai" required>
            </div>
            <div class="col">
                <label for="jamSelesai">Jam Selesai</label>
                <input type="time" id="jamSelesai" required>
            </div>
        </div>

        <div class="form-group">
            <label for="jenisTarget">Jenis Target Rencana Aksi</label>
            <select id="jenisTarget" required>
                <option value="Trajectory">Trajectory (Kuantitatif - Sudah Jelas di Awal)</option>
                <option value="Non-Trajectory">Non-Trajectory (Naratif - Berkaitan)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="rencanaAksi">Rencana Aksi</label>
            <input type="text" id="rencanaAksi" placeholder="Contoh: Menyelesaikan permasalahan laporan..." required>
        </div>

        <div class="form-group">
            <label for="kegiatan">Rencana Kegiatan Harian</label>
            <input type="text" id="kegiatan" placeholder="Contoh: Mengikuti rapat koordinasi..." required>
        </div>

        <div class="form-group">
            <label for="realisasi">Realisasi</label>
            <input type="text" id="realisasi" placeholder="Contoh: 1 Kegiatan / 1 Dokumen" required>
        </div>

        <button type="submit" id="btnSubmit">Buat Bukti Dukung & Simpan</button>
        <div class="loader" id="loader">Memproses dokumen di Google Drive...</div>
    </form>

    <div id="result-box">
        <strong>Berhasil!</strong><br>
        Tautan Bukti Dukung: <br>
        <a href="#" id="docLink" target="_blank">Klik di sini untuk membuka dokumen</a>
        <p style="font-size: 12px; margin-top: 10px; color: #555;">Tautan ini siap di-copy ke aplikasi eKinerja BKN.</p>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT DI BAWAH INI
    const GAS_WEB_APP_URL = "URL_WEB_APP_GAS_ANDA_DISINI";

    // Set tanggal default ke hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    document.getElementById('kinerjaForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload halaman
        
        // Ambil elemen UI
        const btnSubmit = document.getElementById('btnSubmit');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('result-box');
        const docLink = document.getElementById('docLink');

        // Ubah state UI ke loading
        btnSubmit.disabled = true;
        loader.style.display = 'block';
        resultBox.style.display = 'none';

        // Siapkan data JSON
        const payload = {
            tanggal: document.getElementById('tanggal').value,
            jamMulai: document.getElementById('jamMulai').value,
            jamSelesai: document.getElementById('jamSelesai').value,
            jenisTarget: document.getElementById('jenisTarget').value,
            rencanaAksi: document.getElementById('rencanaAksi').value,
            kegiatan: document.getElementById('kegiatan').value,
            realisasi: document.getElementById('realisasi').value
        };

        // Kirim request ke backend Google Apps Script
        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            // Penggunaan text/plain menghindari preflight CORS issue pada GAS
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
        })
        .then(response => response.json())
        .then(data => {
            btnSubmit.disabled = false;
            loader.style.display = 'none';

            if(data.status === "success") {
                // Tampilkan hasil link dokumen
                resultBox.style.display = 'block';
                docLink.href = data.dokumenUrl;
                docLink.innerText = data.dokumenUrl;
                
                // Opsional: Reset form kecuali Rencana Aksi (agar tidak perlu ketik ulang terus)
                document.getElementById('kegiatan').value = '';
                document.getElementById('realisasi').value = '';
            } else {
                alert("Gagal: " + data.pesan);
            }
        })
        .catch(error => {
            btnSubmit.disabled = false;
            loader.style.display = 'none';
            alert("Terjadi kesalahan jaringan atau server. Detail: " + error);
        });
    });
</script>

</body>
</html>
