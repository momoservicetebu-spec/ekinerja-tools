<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input eKinerja Harian ASN</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="date"], input[type="time"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .row { display: flex; gap: 15px; }
        .col { flex: 1; }
        button { width: 100%; background-color: #3498db; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #result-box { display: none; margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 4px; }
        #result-box a { color: #16a085; font-weight: bold; word-break: break-all; cursor: pointer; }
        .loader { display: none; text-align: center; margin-top: 10px; font-style: italic; color: #7f8c8d; }
        .preset-box { background: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px dashed #bdc3c7; }
    </style>
</head>
<body>

<div class="container">
    <h2>Log Kinerja: Penata Layanan Operasional</h2>
    
    <div class="preset-box">
        <label for="templateTugas">⚡ Isi Otomatis Berdasarkan Tugas:</label>
        <select id="templateTugas" onchange="terapkanTemplate()">
            <option value="">-- Pilih Rutinitas Hari Ini --</option>
            <optgroup label="1. IT & Pengembang Aplikasi">
                <option value="dev_fitur">Mendevelop Modul/Fitur Baru Aplikasi Otomasi (Trajectory)</option>
                <option value="dev_bug">Maintenance & Bug Fixing Aplikasi Sekolah (Non-Trajectory)</option>
                <option value="it_teknisi">Setup/Sinkronisasi Server AN/OSN/ABM (Trajectory)</option>
                <option value="it_sapras">Maintenance Hardware & Sapras Sekolah (Non-Trajectory)</option>
            </optgroup>
            <optgroup label="2. Pustakawan">
                <option value="pus_kasir">Layanan Administrasi Kasir & Sirkulasi (Non-Trajectory)</option>
                <option value="pus_bersih">Pemeliharaan Kebersihan & Penataan Rak Buku (Non-Trajectory)</option>
                <option value="pus_stok">Pelaksanaan Stok Opname Buku (Trajectory)</option>
                <option value="pus_literasi">Menjalankan Program Literasi & Numerasi (Trajectory)</option>
            </optgroup>
            <optgroup label="3. Revitalisasi Sekolah">
                <option value="rev_koordinasi">Koordinasi Tim Revitalisasi Sekolah (Non-Trajectory)</option>
            </optgroup>
            <option value="custom">-- Ketik Manual (Kosongkan Form) --</option>
        </select>
    </div>

    <form id="kinerjaForm">
        <div class="form-group row">
            <div class="col"><label for="tanggal">Tanggal</label><input type="date" id="tanggal" required></div>
        </div>
        <div class="form-group row">
            <div class="col"><label for="jamMulai">Mulai</label><input type="time" id="jamMulai" required></div>
            <div class="col"><label for="jamSelesai">Selesai</label><input type="time" id="jamSelesai" required></div>
        </div>

        <div class="form-group">
            <label for="jenisTarget">Jenis Target Rencana Aksi</label>
            <select id="jenisTarget" required>
                <option value="Trajectory">Trajectory (Kuantitatif - Sudah Jelas di Awal)</option>
                <option value="Non-Trajectory">Non-Trajectory (Naratif - Berkaitan)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="rencanaAksi">Rencana Aksi</label>
            <input type="text" id="rencanaAksi" placeholder="Contoh: Mengembangkan layanan otomasi..." required>
        </div>

        <div class="form-group">
            <label for="kegiatan">Rencana Kegiatan Harian</label>
            <input type="text" id="kegiatan" placeholder="Contoh: Menulis kode untuk modul presensi..." required>
        </div>

        <div class="form-group">
            <label for="realisasi">Realisasi</label>
            <input type="text" id="realisasi" placeholder="Contoh: 1 Kegiatan / 1 Modul" required>
        </div>

        <button type="submit" id="btnSubmit">Buat Bukti Dukung & Simpan</button>
        <div class="loader" id="loader">Memproses dokumen di Google Drive...</div>
    </form>

    <div id="result-box">
        <strong>Berhasil!</strong><br>
        Tautan Bukti Dukung: <br>
        <a id="docLink">Klik di sini untuk menyalin & membuka</a>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT DI SINI
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxorz25RFm-lhYN3ialtv4Nu3ptPVI33PBsxeCYWe-0u5bWdwKFQ_1kg8EWsFxB2WeU/exec";

    document.getElementById('tanggal').valueAsDate = new Date();

    // Data Preset Template
    const databaseTemplate = {
        "dev_fitur": { target: "Trajectory", aksi: "Pengembangan Aplikasi Otomasi Manajemen Sekolah", kegiatan: "Merancang dan mendevelop modul/fitur baru pada aplikasi manajemen Perpustakaab TU/Guru", realisasi: "1 Modul/Fitur" },
        "dev_bug": { target: "Non-Trajectory", aksi: "Pemeliharaan Aplikasi Otomasi Sekolah", kegiatan: "Melakukan monitoring server, bug fixing, dan optimalisasi sistem aplikasi sekolah", realisasi: "1 Kegiatan" },
        "it_teknisi": { target: "Trajectory", aksi: "Dukungan Teknis Asesmen Nasional (AN/OSN/ABM/D-Smart)", kegiatan: "Melakukan setup, instalasi, dan sinkronisasi server/klien untuk pelaksanaan ujian", realisasi: "1 Kegiatan" },
        "it_sapras": { target: "Non-Trajectory", aksi: "Pemeliharaan Sarana Prasarana IT Sekolah", kegiatan: "Mengecek dan melakukan maintenance hardware jaringan serta perangkat sapras", realisasi: "1 Kegiatan" },
        "pus_kasir": { target: "Non-Trajectory", aksi: "Pelayanan Administrasi Perpustakaan", kegiatan: "Stanby melayani sirkulasi peminjaman/pengembalian buku dan administrasi kasir", realisasi: "1 Kegiatan" },
        "pus_bersih": { target: "Non-Trajectory", aksi: "Pengelolaan Tata Ruang Perpustakaan", kegiatan: "Melakukan kebersihan ruang baca dan penataan rak buku", realisasi: "1 Kegiatan" },
        "pus_stok": { target: "Trajectory", aksi: "Inventarisasi Koleksi Perpustakaan", kegiatan: "Melakukan stok opname dan pencatatan buku perpustakaan", realisasi: "1 Dokumen Laporan" },
        "pus_literasi": { target: "Trajectory", aksi: "Pelaksanaan Program Literasi & Numerasi", kegiatan: "Menjalankan program literasi dan numerasi untuk menumbuhkan minat baca siswa", realisasi: "1 Kegiatan" },
        "rev_koordinasi": { target: "Non-Trajectory", aksi: "Pelaksanaan Program Revitalisasi Sekolah", kegiatan: "Berkoordinasi dalam tim untuk program pemeliharaan dan revitalisasi sekolah", realisasi: "1 Kegiatan" },
        "custom": { target: "Trajectory", aksi: "", kegiatan: "", realisasi: "" }
    };

    function terapkanTemplate() {
        const pilihan = document.getElementById('templateTugas').value;
        if (pilihan && databaseTemplate[pilihan]) {
            const data = databaseTemplate[pilihan];
            document.getElementById('jenisTarget').value = data.target;
            document.getElementById('rencanaAksi').value = data.aksi;
            document.getElementById('kegiatan').value = data.kegiatan;
            document.getElementById('realisasi').value = data.realisasi;
        }
    }

    document.getElementById('kinerjaForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        const jamMulai = document.getElementById('jamMulai').value;
        const jamSelesai = document.getElementById('jamSelesai').value;
        
        if (jamSelesai <= jamMulai) {
            alert("⚠️ Kesalahan input: 'Jam Selesai' harus lebih lambat dari 'Jam Mulai'.");
            return; 
        }

        const btnSubmit = document.getElementById('btnSubmit');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('result-box');
        const docLink = document.getElementById('docLink');

        btnSubmit.disabled = true;
        loader.style.display = 'block';
        resultBox.style.display = 'none';

        const payload = {
            tanggal: document.getElementById('tanggal').value,
            jamMulai: jamMulai,
            jamSelesai: jamSelesai,
            jenisTarget: document.getElementById('jenisTarget').value,
            rencanaAksi: document.getElementById('rencanaAksi').value,
            kegiatan: document.getElementById('kegiatan').value,
            realisasi: document.getElementById('realisasi').value
        };

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
        })
        .then(response => response.json())
        .then(data => {
            btnSubmit.disabled = false;
            loader.style.display = 'none';

            if(data.status === "success") {
                resultBox.style.display = 'block';
                docLink.innerText = data.dokumenUrl;
                
                docLink.onclick = function(event) {
                    event.preventDefault();
                    navigator.clipboard.writeText(data.dokumenUrl).then(() => {
                        alert("✅ Tautan Bukti Dukung disalin! Silakan paste di eKinerja.");
                    });
                    window.open(data.dokumenUrl, '_blank');
                };
                
                // Kembalikan form ke mode kosong setelah disubmit
                document.getElementById('templateTugas').value = "custom";
                terapkanTemplate();
            } else {
                alert("Gagal: " + data.pesan);
            }
        })
        .catch(error => {
            btnSubmit.disabled = false;
            loader.style.display = 'none';
            alert("Terjadi kesalahan. Pastikan URL Web App GAS sudah benar. Detail: " + error);
        });
    });
</script>

</body>
</html>
