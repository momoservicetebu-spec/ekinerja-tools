<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi e-Kinerja SMAN 1 BA</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 10px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;}
        
        /* KOTAK UTAMA */
        .container { width: 100%; max-width: 650px; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box; margin-top: 20px;}
        
        /* HALAMAN LOGIN */
        #login-section { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px 10px; }
        .lock-icon { font-size: 50px; margin-bottom: 10px; }
        #login-section h2 { margin-bottom: 5px; color:#2c3e50; }
        #login-section p { color:#7f8c8d; font-size: 14px; margin-bottom: 25px; text-align: center; }
        .login-input { width: 100%; max-width: 300px; padding: 15px; border: 1px solid #ced4da; border-radius: 6px; font-size: 16px; text-align: center; letter-spacing: 2px; margin-bottom: 15px;}
        
        /* APLIKASI UTAMA (Disembunyikan di awal) */
        #app-section { display: none; width: 100%; }
        
        /* HEADER APLIKASI */
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #ecf0f1; padding-bottom: 15px; }
        .header-app h2 { margin: 0; font-size: 18px; color: #2c3e50; }
        .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 13px;}
        
        /* TAB NAVIGASI */
        .tab-nav { display: flex; margin-bottom: 20px; border-radius: 8px; overflow: hidden; border: 1px solid #3498db; }
        .tab-nav button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; background-color: #fff; color: #3498db; border: none; cursor: pointer; }
        .tab-nav button.active { background-color: #3498db; color: #fff; }
        
        /* FORM ELEMENTS */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #34495e; }
        input[type="text"], input[type="date"], input[type="time"], input[type="file"], input[type="url"], input[type="password"], select { width: 100%; padding: 12px 15px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 16px; }
        
        .row { display: flex; gap: 15px; } .col { flex: 1; }
        .info-box { background: #e8f4f8; padding: 12px; border-left: 4px solid #3498db; border-radius: 4px; font-size: 13px; margin-top: 5px; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 12px; background: #fff3e0; padding: 15px; border-radius: 6px; border: 1px solid #ffcc80; margin-bottom: 15px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: 22px; height: 22px; margin: 0; flex-shrink: 0; }
        
        .btn-primary { width: 100%; background-color: #3498db; color: white; padding: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary:hover { background-color: #2980b9; }
        
        #result-box { display: none; margin-top: 20px; padding: 15px; background: #e8f8f5; border-left: 5px solid #1abc9c; border-radius: 6px; font-size: 14px; word-break: break-word; }
        .loader { display: none; text-align: center; margin-top: 15px; font-size: 14px; font-style: italic; color: #7f8c8d; }
        
        /* DASHBOARD */
        #dashboard-section { display: none; }
        .table-responsive { overflow-x: auto; margin-top: 10px; border-radius: 6px; border: 1px solid #ecf0f1; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ecf0f1; }
        th { background-color: #f8f9fa; font-weight: bold; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; display: inline-block;}
        .badge-selesai { background-color: #27ae60; } .badge-proses { background-color: #f39c12; }
        .link-btn { background: #ecf0f1; color: #2980b9; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 12px;}
        
        @media screen and (max-width: 480px) {
            body { padding: 0; background: #fff; align-items: flex-start;}
            .container { padding: 15px; margin-top: 0; border-radius: 0; box-shadow:none;}
            .row { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- ============================================== -->
    <!-- HALAMAN LOGIN -->
    <!-- ============================================== -->
    <div id="login-section">
        <div class="lock-icon">🔒</div>
        <h2>Portal Keamanan</h2>
        <p>Aplikasi e-Kinerja Guntoro, S.Pd</p>
        
        <input type="password" id="loginPassword" class="login-input" placeholder="Masukkan Password">
        <button onclick="prosesLogin()" class="btn-primary" style="max-width:300px;" id="btnLogin">Masuk Aplikasi</button>
        <div class="loader" id="loginLoader">Memvalidasi kunci...</div>
    </div>

    <!-- ============================================== -->
    <!-- APLIKASI UTAMA (FORM & DASHBOARD) -->
    <!-- ============================================== -->
    <div id="app-section">
        <div class="header-app">
            <h2>Log Kinerja ASN</h2>
            <button onclick="logout()" class="btn-logout">Logout 🔓</button>
        </div>

        <div class="tab-nav">
            <button id="tabForm" class="active" onclick="switchTab('form')">📝 Form Input</button>
            <button id="tabDash" onclick="switchTab('dashboard')">📊 Dashboard</button>
        </div>

        <!-- FORM INPUT -->
        <div id="form-section">
            <div class="form-group">
                <label>⚡ Isi Otomatis Berdasarkan Tugas:</label>
                <select id="templateTugas" onchange="terapkanTemplate()">
                    <option value="">-- Pilih Rutinitas Hari Ini --</option>
                    <option value="dev_fitur">Dev. Modul Aplikasi Baru (Trajectory)</option>
                    <option value="dev_bug">Maintenance & Bug Fixing (Non-Trajectory)</option>
                    <option value="it_teknisi">Setup Server AN/OSN (Trajectory)</option>
                    <option value="it_sapras">Maintenance Hardware (Non-Trajectory)</option>
                    <option value="pus_kasir">Layanan Kasir Perpus (Non-Trajectory)</option>
                    <option value="pus_bersih">Penataan Rak Buku (Non-Trajectory)</option>
                    <option value="pus_stok">Stok Opname Buku (Trajectory)</option>
                    <option value="pus_literasi">Program Literasi/Numerasi (Trajectory)</option>
                    <option value="rev_koordinasi">Koordinasi Tim Revitalisasi (Non-Trajectory)</option>
                    <option value="custom">-- Ketik Manual --</option>
                </select>
            </div>

            <form id="kinerjaForm">
                <div class="form-group row">
                    <div class="col"><label>Tanggal</label><input type="date" id="tanggal" required></div>
                </div>
                <div class="form-group row">
                    <div class="col"><label>Jam Mulai</label><input type="time" id="jamMulai" onchange="hitungDurasi()" required></div>
                    <div class="col"><label>Jam Selesai</label><input type="time" id="jamSelesai" onchange="hitungDurasi()" required></div>
                </div>
                <div class="info-box" id="durasiInfo">Durasi: 0 Jam 0 Menit</div>

                <div class="form-group" style="margin-top:15px;"><label>Jenis Target</label><select id="jenisTarget" required><option value="Trajectory">Trajectory (Kuantitatif)</option><option value="Non-Trajectory">Non-Trajectory (Berkaitan)</option></select></div>
                <div class="checkbox-group" onclick="document.getElementById('isSelesai').click()"><input type="checkbox" id="isSelesai" onclick="event.stopPropagation()"><label for="isSelesai"><strong>Checklist "Selesai pada Rencana Aksi"</strong></label></div>
                <div class="form-group"><label>Rencana Aksi</label><input type="text" id="rencanaAksi" required></div>
                <div class="form-group"><label>Kegiatan Harian</label><input type="text" id="kegiatan" required></div>
                <div class="form-group"><label>Realisasi</label><input type="text" id="realisasi" required></div>
                
                <div class="form-group" style="background:#f8faff; padding:15px; border:1px dashed #3498db; border-radius:6px;">
                    <label style="color:#2980b9; font-size:15px;">📂 Bukti Dukung (Opsional)</label>
                    <div style="margin-top: 10px;"><label style="font-size:13px; color:#444;">1. Upload Foto/Screenshot (Gambar):</label><input type="file" id="fotoKegiatan" accept="image/*" style="background:#fff; border:none; padding:8px 0;"></div>
                    <div style="margin-top: 15px;"><label style="font-size:13px; color:#444;">2. Link Dokumen (Word/Excel):</label><input type="url" id="linkDokumen" placeholder="Paste link..." style="background:#fff;"></div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-primary">Buat Bukti Dukung & Simpan</button>
                <div class="loader" id="loader">Aman terkoneksi. Mengirim data rahasia...</div>
            </form>

            <div id="result-box"><strong>✅ Berhasil!</strong><br><a id="docLink" href="#" style="color:#16a085; font-weight:bold; word-break:break-all;">Klik di sini untuk membuka</a></div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashboard-section">
            <div class="table-responsive">
                <table>
                    <thead><tr><th style="min-width: 90px;">Tgl/Waktu</th><th style="min-width: 150px;">Kegiatan</th><th>Output</th><th>Laporan</th></tr></thead>
                    <tbody id="dashboard-body"><tr><td colspan="4" style="text-align:center; padding: 20px;">Memuat data terenkripsi...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxorz25RFm-lhYN3ialtv4Nu3ptPVI33PBsxeCYWe-0u5bWdwKFQ_1kg8EWsFxB2WeU/exec";

    // ============================================
    // SISTEM KEAMANAN OTENTIKASI
    // ============================================
    document.addEventListener("DOMContentLoaded", function() {
        // Cek apakah user sudah punya token di HP-nya
        const token = localStorage.getItem("app_kinerja_token");
        if(token) {
            bukaAplikasi();
        }
    });

    function prosesLogin() {
        const pass = document.getElementById('loginPassword').value;
        if(!pass) return alert("Masukkan password!");
        
        document.getElementById('btnLogin').disabled = true;
        document.getElementById('loginLoader').style.display = 'block';

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify({ action: "login", password: pass })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('btnLogin').disabled = false;
            document.getElementById('loginLoader').style.display = 'none';
            if(data.status === "success") {
                // Simpan token ke brankas browser
                localStorage.setItem("app_kinerja_token", data.token);
                bukaAplikasi();
            } else {
                alert("Akses Ditolak: " + data.pesan);
                document.getElementById('loginPassword').value = '';
            }
        }).catch(err => {
            document.getElementById('btnLogin').disabled = false;
            document.getElementById('loginLoader').style.display = 'none';
            alert("Gagal koneksi ke server keamanan.");
        });
    }

    function bukaAplikasi() {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
    }

    function logout() {
        localStorage.removeItem("app_kinerja_token");
        document.getElementById('app-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'flex';
        document.getElementById('loginPassword').value = '';
    }

    // ============================================
    // TAB NAVIGASI & DASHBOARD SECURE FETCH
    // ============================================
    function switchTab(tabName) {
        if(tabName === 'form') {
            document.getElementById('form-section').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('tabForm').classList.add('active');
            document.getElementById('tabDash').classList.remove('active');
        } else {
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
            document.getElementById('tabForm').classList.remove('active');
            document.getElementById('tabDash').classList.add('active');
            loadDashboardSecure(); 
        }
    }

    function loadDashboardSecure() {
        const tbody = document.getElementById('dashboard-body');
        const token = localStorage.getItem("app_kinerja_token");
        if(!token) return logout();

        tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>⏳ Mengambil data aman...</td></tr>";
        
        // MENGIRIM TOKEN KE SERVER MELALUI PARAMETER URL
        fetch(GAS_WEB_APP_URL + "?token=" + token) 
        .then(res => res.json())
        .then(data => {
            if(data.status === "success") {
                if(data.data.length === 0) return tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>Belum ada data.</td></tr>";
                let html = "";
                data.data.forEach(item => {
                    let badge = item.status === "Selesai" ? "<span class='badge badge-selesai'>Selesai</span>" : "<span class='badge badge-proses'>Proses</span>";
                    html += `<tr><td><strong>${item.tanggal}</strong><br><small>${item.waktu}</small></td><td>${item.kegiatan}</td><td>${item.realisasi}<br><div style="margin-top:5px;">${badge}</div></td><td><a href="${item.link}" target="_blank" class="link-btn">Buka</a></td></tr>`;
                });
                tbody.innerHTML = html;
            } else {
                tbody.innerHTML = `<tr><td colspan='4' style='text-align:center; color:red;'>Gagal: ${data.pesan}</td></tr>`;
                if(data.pesan.includes("Ditolak")) logout();
            }
        });
    }

    // ============================================
    // LOGIKA FORM SECURE SUBMIT
    // ============================================
    document.getElementById('tanggal').valueAsDate = new Date();
    const now = new Date();
    document.getElementById('jamMulai').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    
    // (Data template diringkas agar skrip bersih)
    const databaseTemplate = { "dev_fitur": { target: "Trajectory", aksi: "Pengembangan Aplikasi", kegiatan: "Mendevelop fitur baru", realisasi: "1 Modul", selesai: true }, "pus_kasir": { target: "Non-Trajectory", aksi: "Pelayanan Perpustakaan", kegiatan: "Sirkulasi peminjaman", realisasi: "1 Kegiatan", selesai: false }};
    
    function terapkanTemplate() {
        const p = document.getElementById('templateTugas').value;
        if(p && databaseTemplate[p]) {
            document.getElementById('jenisTarget').value = databaseTemplate[p].target;
            document.getElementById('rencanaAksi').value = databaseTemplate[p].aksi;
            document.getElementById('kegiatan').value = databaseTemplate[p].kegiatan;
            document.getElementById('realisasi').value = databaseTemplate[p].realisasi;
            document.getElementById('isSelesai').checked = databaseTemplate[p].selesai;
        }
    }
    
    function hitungDurasi() {
        const start = new Date("01/01/2000 " + document.getElementById('jamMulai').value);
        const end = new Date("01/01/2000 " + document.getElementById('jamSelesai').value);
        if(end < start) return "";
        let diff = (end - start) / 60000; 
        document.getElementById('durasiInfo').innerText = `Durasi: ${Math.floor(diff/60)} Jam ${diff%60} Menit`;
        return `${Math.floor(diff/60)} Jam ${diff%60} Menit`;
    }

    document.getElementById('kinerjaForm').addEventListener('submit', function(e) {
        e.preventDefault(); 
        const durasiFinal = hitungDurasi();
        const token = localStorage.getItem("app_kinerja_token");
        if(!token) return logout(); // Keamanan lapis kedua di sisi klien
        
        document.getElementById('btnSubmit').disabled = true; 
        document.getElementById('loader').style.display = 'block';

        const fileInput = document.getElementById('fotoKegiatan');
        let fotoBase64 = ""; let fotoMimeType = "";

        if(fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                kirimDataSecure(ev.target.result.split(',')[1], fileInput.files[0].type, durasiFinal, token);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            kirimDataSecure("", "", durasiFinal, token);
        }
    });

    function kirimDataSecure(fotoBase64, fotoMimeType, durasiFinal, token) {
        const payload = {
            action: "submit", // PENTING: Penanda agar server tahu ini form
            token: token,     // PENTING: Kunci akses ke server
            tanggal: document.getElementById('tanggal').value,
            jamMulai: document.getElementById('jamMulai').value,
            jamSelesai: document.getElementById('jamSelesai').value,
            durasi: durasiFinal,
            jenisTarget: document.getElementById('jenisTarget').value,
            isSelesai: document.getElementById('isSelesai').checked,
            rencanaAksi: document.getElementById('rencanaAksi').value,
            kegiatan: document.getElementById('kegiatan').value,
            realisasi: document.getElementById('realisasi').value,
            linkDokumen: document.getElementById('linkDokumen').value,
            fotoBase64: fotoBase64,
            fotoMimeType: fotoMimeType
        };

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('btnSubmit').disabled = false;
            document.getElementById('loader').style.display = 'none';
            if(data.status === "success") {
                document.getElementById('result-box').style.display = 'block';
                document.getElementById('docLink').href = data.dokumenUrl; 
                document.getElementById('docLink').innerText = data.dokumenUrl;
                document.getElementById('fotoKegiatan').value = "";
                document.getElementById('linkDokumen').value = "";
            } else {
                alert("Gagal: " + data.pesan);
                if(data.pesan.includes("Ditolak")) logout(); // Tendang user jika token expired/salah
            }
        }).catch(err => {
            document.getElementById('btnSubmit').disabled = false;
            document.getElementById('loader').style.display = 'none';
            alert("Jaringan bermasalah.");
        });
    }
</script>
</body>
</html>
